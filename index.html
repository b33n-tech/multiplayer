<!-- index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Point Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial, sans-serif;
}
#dot{
  position:absolute;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#00ff88;
  box-shadow:0 0 20px #00ff88;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}
#info{
  position:fixed;
  top:15px;
  left:15px;
  color:white;
  font-size:14px;
  opacity:.8;
}
</style>
</head>
<body>

<div id="info">En attente de la télécommande...</div>
<div id="dot"></div>

<script>
const SUPABASE_URL = "https://TONPROJET.supabase.co";
const SUPABASE_KEY = "TA_CLE_ANON";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const dot = document.getElementById("dot");

let x = window.innerWidth / 2;
let y = window.innerHeight / 2;

function draw(){
  dot.style.left = x + "px";
  dot.style.top = y + "px";
}

draw();

function move(dir){
  const step = 30;

  if(dir === "left") x -= step;
  if(dir === "right") x += step;
  if(dir === "up") y -= step;
  if(dir === "down") y += step;

  x = Math.max(20, Math.min(window.innerWidth - 20, x));
  y = Math.max(20, Math.min(window.innerHeight - 20, y));

  draw();
}

const channel = client.channel("remote-control");

channel
.on("broadcast", { event:"move" }, ({payload})=>{
   move(payload.dir);
})
.subscribe();
</script>

</body>
</html>
